include:
  - project: univention/infrastructure/docker-services
    file:
      - prek.yml

variables:
  UV_VERSION: 0.6.6
  PYTHON_VERSION: 3.11
  BASE_LAYER: bookworm-slim
  UV_IMAGE: ghcr.io/astral-sh/uv:$UV_VERSION-python$PYTHON_VERSION-$BASE_LAYER
  # GitLab CI creates a separate mountpoint for the build directory,
  # so we need to copy instead of using hard links.
  UV_LINK_MODE: copy
  DEBIAN_PACKAGE: lancelog
  DEBIAN_RELEASE: 5.2-0-0
  DEBIAN_SCOPE: errata5.2-4

stages:
  - prepare
  - lint
  - test
  - sonarqube
  - build
  - publish

prepare:
  stage: prepare
  script:
    - sed -rne '1s/^lancelog \(([^)]+)\) ([^;]+);.*/DEBVER=\1\nDEBDIST=\2/p;T;q' debian/changelog >.env
  artifacts:
    reports:
      dotenv: .env

pre_commit:
  stage: lint
  extends: .prek

test:
  stage: test
  image: $UV_IMAGE
  script:
    - uv sync --all-extras
    - uv run pytest
  coverage: '/TOTAL.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    paths:
      - coverage.xml
      - pytest-junit.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
      junit: pytest-junit.xml
    expire_in: "1 day"
    when: "always"
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'main'

sonarqube-scan:
  stage: sonarqube
  needs:
    - test
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
    GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task
  image:
      name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/sonarsource/sonar-scanner-cli:11
      entrypoint: [""]
  cache:
    policy: pull-push
    key: "sonar-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - "${SONAR_USER_HOME}/cache"
      - sonar-scanner/
  script:
    - sonar-scanner -Dsonar.host.url="${SONAR_HOST_URL}"
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED == "true"
    - if: $CI_PIPELINE_SOURCE == "web"

build_deb_repo_import:
  stage: build
  variables:
    GIT_STRATEGY: none
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_REF_PROTECTED == "true"
  tags:
    - omar
  script:
    - |
      repo_admin.py \
        --git "$CI_REPOSITORY_URL" \
        --force \
        --ignore-patches \
        --branch "$CI_COMMIT_REF_NAME" \
        --path "." \
        --release "$DEBIAN_RELEASE" \
        --scope "$DEBIAN_SCOPE" \
        --package "$DEBIAN_PACKAGE" \
        --verbose

build_deb_repo_build:
  stage: build
  needs:
    - job: build_deb_repo_import
  variables:
    GIT_STRATEGY: none
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_REF_PROTECTED == "true"
  tags:
    - ladda
  script:
    - |
      build-package-ng \
        --no-pbuilder-update \
        --release "$DEBIAN_RELEASE" \
        --scope "$DEBIAN_SCOPE" \
        --package "$DEBIAN_PACKAGE"

build_deb_package_for_branch:
  stage: build
  dependencies:
    - prepare
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'main'
  parallel:
    matrix:
      - distribution:
        - debian:bookworm-slim
        - ubuntu:24.04
        - ubuntu:25.04
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/$distribution
  variables:
    DEBIAN_FRONTEND: noninteractive
    LC_ALL: C.UTF-8
  before_script:
    - apt-get update
    - apt-get install -y ca-certificates gnupg wget
    - wget https://updates.software-univention.de/univention-archive-key-ucs-52x.gpg -O /etc/apt/trusted.gpg.d/univention-archive-key-ucs-52x.gpg
    - echo "deb [signed-by=/etc/apt/trusted.gpg.d/univention-archive-key-ucs-52x.gpg] https://updates.software-univention.de/ errata523 main" > /etc/apt/sources.list.d/ucs-523-errata.list
    - apt-get update
    - apt-get install -y python3-logfmter
    - apt-get --assume-yes build-dep .
  script:
    - PYTHONPATH="$PYTHONPATH:$PWD/src" dpkg-buildpackage --no-sign -b
    - apt-get -q --assume-yes install ../python3-lancelog*.deb
    - rm -rf "$CI_PROJECT_DIR/public"
    - mkdir -p "$CI_PROJECT_DIR/public/${distribution%-slim}"
    - mv -v -t "$CI_PROJECT_DIR/public/${distribution%-slim}/" ../*.deb
    - cd "$CI_PROJECT_DIR/public/${distribution%-slim}"
    - dpkg-scanpackages . >Packages
  artifacts:
    paths:
      - public
    expire_in: 1 day

build_pip_package:
  stage: build
  artifacts:
    paths:
      - dist/lancelog*
    expire_in: 1 week
  image: $UV_IMAGE
  script:
    - |
      if [ "$CI_COMMIT_BRANCH" != "$CI_DEFAULT_BRANCH" ]; then
        ORI_VERSION="$(uvx --from=toml-cli toml get --toml-path=pyproject.toml project.version)"
        uvx --from=toml-cli toml set --toml-path=pyproject.toml project.version "${ORI_VERSION}.dev0+${CI_COMMIT_REF_SLUG//-/.}.$CI_COMMIT_SHORT_SHA"
      else
        true
      fi
    - uv build

publish_gitlab_pip:
  stage: publish
  needs:
    - job: build_pip_package
  image: $UV_IMAGE
  script:
    - uv publish --publish-url ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi --username gitlab-ci-token --password ${CI_JOB_TOKEN}

ai-review:
  stage: test
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/nikitafilonov/ai-review:latest
  rules:
    - if: '$CI_MERGE_REQUEST_IID'
      when: "manual"
  allow_failure: true
  script:
    - ai-review show-config
    - ai-review run
  variables:
    # Configuration: https://github.com/Nikita-Filonov/ai-review/blob/main/docs/ci/gitlab.yaml
    # Model names: https://litellm.knut.univention.de/ui/?page=models

    # --- LLM configuration ---
    LLM__PROVIDER: "OPENAI"  # LiteLLM's OpenAI interface also allows using non-OpenAI models.
    LLM__META__MODEL: "anthropic/claude-opus-4-7"  # LiteLLM encodes the names differently to what some AIs expect. Ignore their warning.
    LLM__META__MAX_TOKENS: "50000"
    # LLM__META__TEMPERATURE: "0.3"  # Don't set temperature for Opus 4.7.
    LLM__HTTP_CLIENT__API_URL: "https://litellm.knut.univention.de"
    LLM__HTTP_CLIENT__API_TOKEN: "$OPENAI_API_KEY"

    # --- GitLab integration ---
    VCS__PROVIDER: "GITLAB"
    VCS__PIPELINE__PROJECT_ID: "$CI_PROJECT_ID"
    VCS__PIPELINE__MERGE_REQUEST_ID: "$CI_MERGE_REQUEST_IID"
    VCS__HTTP_CLIENT__API_URL: "$CI_SERVER_URL"
    # Using "$GITLAB_TOKEN" because "$CI_JOB_TOKEN" seems to lack the required permissions.
    # GITLAB_TOKEN is defined as a CI/CD group variable at /univention/dev.
    VCS__HTTP_CLIENT__API_TOKEN: "$GITLAB_TOKEN"

    AGENT__ENABLED: "true"
    AGENT__COMMAND_TIMEOUT: "60"
    PROMPT__CONTEXT__COMPANY_NAME: "Univention"
    REVIEW__MODE: "ADDED_AND_REMOVED_WITH_CONTEXT"
    REVIEW__CONTEXT_LINES: "20"
    REVIEW__REVIEW_ADDED_MARKER: ""  # Set this to empty, when the agent complains about "added" comments.
    REVIEW__REVIEW_REMOVED_MARKER: ""  # Set this to empty, when the agent complains about "removed" comments.
    # --- Debug ---
    # LOGGER__LEVEL: "DEBUG"
    # ARTIFACTS__LLM_ENABLED: "true"
    # ARTIFACTS__VCS_ENABLED: "true"
  # --- Debug ---
  # artifacts:
  #   paths:
  #     - artifacts  # ai-review stores communication with GitLab and AI model here, when activated above.
