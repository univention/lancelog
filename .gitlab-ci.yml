build_pip_package:
  stage: build
  artifacts:
    paths:
      - dist/lancelog*
    expire_in: 1 week
  image: $UV_IMAGE
  script:
    - |
      if [ "$CI_COMMIT_BRANCH" != "$CI_DEFAULT_BRANCH" ]; then
        ORI_VERSION="$(uvx --from=toml-cli toml get --toml-path=pyproject.toml project.version)"
        uvx --from=toml-cli toml set --toml-path=pyproject.toml project.version "${ORI_VERSION}.dev0+${CI_COMMIT_REF_SLUG//-/.}.$CI_COMMIT_SHORT_SHA"
      else
        true
      fi
    - uv build

publish_gitlab_pip:
  stage: publish
  dependencies:
    - build_pip_package
  image: $UV_IMAGE
  script:
    - uv publish --publish-url ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi --username gitlab-ci-token --password ${CI_JOB_TOKEN}
