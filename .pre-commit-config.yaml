# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    - id: check-added-large-files
    - id: check-merge-conflict
    - id: trailing-whitespace
    - id: end-of-file-fixer
    - id: check-toml
  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
    - id: python-check-blanket-noqa
    - id: python-no-eval
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        args: [ "--fix", "--unsafe-fixes", "--exit-non-zero-on-fix"]
      - id: ruff-format
  - repo: https://github.com/rohaquinlop/complexipy-pre-commit
    rev: v8.1.0
    hooks:
      - id: complexipy
        types_or: [python, pyi]
        args: ["--max-complexity-allowed", "15"]  # SonarQube's limit for cognitive complexity
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
    - id: codespell
      additional_dependencies:
        - tomli
      args: [--write-changes]
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
    - id: mypy
      args: ["--python-version", "3.11", "--ignore-missing-imports", "--strict", "--pretty"]
      additional_dependencies: ["mypy-extensions>=1.0"]
  - repo: https://github.com/jackdewinter/pymarkdown
    rev: v0.9.29
    hooks:
      - id: pymarkdown
        args:
          - -d line-length,no-bare-urls,no-duplicate-heading,no-duplicate-header
          - scan
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.6.6
    hooks:
      - id: uv-lock
        args: ["--directory", "lancelog"]
        files: "^lancelog"
